name: Rust third-party license inventory

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Docker workspace
        run: |
          mkdir -p .cache/cargo .cache/target ../JUCE-upstream
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: wyldtone/plugin-sdk:local
          cache-from: type=gha,scope=wyldtone-sdk
          cache-to: type=gha,mode=max,scope=wyldtone-sdk
      - name: Collect full dependency metadata
        run: |
          docker compose run --rm --entrypoint cargo sdk metadata --format-version 1 --locked > /tmp/wyldtone-cargo-metadata.json
          python3 scripts/license_inventory.py < /tmp/wyldtone-cargo-metadata.json > rust-license-inventory.tsv 2> rust-license-review.txt
          cat rust-license-review.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rust-third-party-license-inventory
          path: |
            rust-license-inventory.tsv
            rust-license-review.txt
          retention-days: 30
