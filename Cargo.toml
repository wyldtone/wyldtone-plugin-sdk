[workspace]
members = ["crates/wyldtone-plugin-api", "crates/wyldtone-plugin-runtime", "crates/wyldtone-plugin-packager", "crates/wyldtone-cli", "crates/wyldtone-wap-host"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.2.0-beta.1"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
debug = 0